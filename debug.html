<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENAGERIE — debug</title>
<meta name="description" content="The main screen plus pose, ink, action and regen controls. For judging form and motion.">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="stage" aria-label="Procedurally drawn creature grid"></canvas>

<header class="bar">
  <a class="mark" href="./index.html">MENAGERIE</a>
  <span class="sub">DEBUG · <a href="./index.html">← GRID</a></span>
  <span class="status" id="status">BOOT</span>
</header>

<aside class="deck">
  <section class="card">
    <h2>SEED</h2>
    <p class="seed" id="seed">·······</p>
    <button id="reseed" class="wide">NEW SEED</button>
  </section>

  <section class="card">
    <h2>POSE</h2>
    <div class="row seg" id="poseSeg" role="group" aria-label="Pose">
      <button data-pose="motion" class="on">MOTION</button>
      <button data-pose="bind">BIND</button>
    </div>
  </section>

  <section class="card">
    <h2>INK</h2>
    <div class="row seg" id="inkSeg" role="group" aria-label="Ink">
      <button data-ink="boil" class="on">BOIL</button>
      <button data-ink="still">STILL</button>
    </div>
  </section>

  <section class="card">
    <h2>ACTION</h2>
    <select id="actionSel" class="wide" aria-label="Force an action">
      <option value="">AUTO</option>
    </select>
  </section>

  <section class="card">
    <h2>REGEN</h2>
    <div class="row seg" id="liveSeg" role="group" aria-label="Regen toggle">
      <button data-live="off" class="on">STILL</button>
      <button data-live="on">LIVE</button>
    </div>
  </section>

  <section class="card">
    <h2>SPECIES</h2>
    <div class="row seg" id="speciesSeg" role="group" aria-label="Species preview">
      <button data-species="all" class="on">ALL</button>
      <button data-species="human">HUMAN</button>
      <button data-species="cat">CAT</button>
      <button data-species="pup">PUP</button>
      <button data-species="imp">IMP</button>
    </div>
  </section>

  <section class="card">
    <h2>GRID</h2>
    <div class="row seg" id="countSeg" role="group" aria-label="Grid size">
      <button data-grid="1x1">1×1</button>
      <button data-grid="5x4">5×4</button>
      <button data-grid="7x5" class="on">7×5</button>
      <button data-grid="9x6">9×6</button>
    </div>
  </section>

  <section class="card">
    <h2>EXPORT</h2>
    <button id="exportPng" class="wide">PNG</button>
  </section>

  <p class="hint">R seed · B pose · I ink · S regen · ACTION forces one action · controls ride in the URL · <a href="./gallery.html">PARTS GALLERY →</a></p>
</aside>

<noscript><p class="noscript">This page needs WebGL and JavaScript.</p></noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
