<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENAGERIE — parts gallery</title>
<meta name="description" content="Every value of one slot on the same individual. Species and seed held fixed.">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body class="gallery">

<canvas id="stage" aria-label="Creatures by slot value"></canvas>
<div id="labels" class="labels" aria-hidden="true"></div>

<header class="bar">
  <a class="mark" href="./index.html">MENAGERIE</a>
  <span class="sub">PARTS GALLERY · <a href="./index.html">← GRID</a></span>
  <span class="status" id="status">BOOT</span>
</header>

<aside class="deck">
  <section class="card">
    <h2>SLOT</h2>
    <select id="slotSel" class="wide" aria-label="Slot"></select>
  </section>

  <section class="card">
    <h2>SPECIES</h2>
    <select id="speciesSel" class="wide" aria-label="Species"></select>
  </section>

  <section class="card">
    <h2>FIX</h2>
    <div class="row seg">
      <select id="fixSlot" aria-label="Slot to pin"></select>
      <select id="fixValue" aria-label="Value to pin"></select>
    </div>
  </section>

  <section class="card">
    <h2>SEED</h2>
    <p class="seed" id="seed">·······</p>
    <button id="reseed" class="wide">NEW SEED</button>
  </section>

  <section class="card">
    <h2>POSE</h2>
    <div class="row seg" id="poseSeg" role="group" aria-label="Pose">
      <button data-pose="motion">MOTION</button>
      <button data-pose="bind" class="on">BIND</button>
    </div>
  </section>

  <p class="hint">Same individual, only the slot value changes · FIX pins one other slot · R seed · B pose · values the species forbids are drawn too</p>
</aside>

<noscript><p class="noscript">This page needs WebGL and JavaScript.</p></noscript>

<script type="module" src="./src/gallery.js"></script>
</body>
</html>
