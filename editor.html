<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENAGERIE — editor</title>
<meta name="description" content="Pick a species, then build one creature by hand — every slot, colour and proportion.">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body class="editor">

<canvas id="stage" aria-label="The creature being edited"></canvas>

<header class="bar">
  <a class="mark" href="./index.html">MENAGERIE</a>
  <nav class="nav"><a href="./index.html">GRID</a><a href="./debug.html">DEBUG</a><a href="./gallery.html">GALLERY</a><span class="here">EDITOR</span><a href="./audit.html">AUDIT</a><a href="./pixeldiff.html">DIFF</a><a href="./how.html">HOW</a></nav>
  <span class="status" id="status">BOOT</span>
</header>

<aside class="deck">
  <section class="card">
    <h2>CREATURE</h2>
    <button id="shuffle" class="wide" title="A fresh creature — the species too">SHUFFLE</button>
  </section>

  <section class="card">
    <h2>SPECIES</h2>
    <select id="speciesSel" class="wide" aria-label="Species"></select>
    <select id="stateSel" class="wide" aria-label="State" title="Normal, or a ghost — one pale tone, hollow eyes, only floats"></select>
  </section>

  <details class="card" open>
    <summary><h2>PART</h2></summary>
    <div id="parts" class="fields"></div>
  </details>

  <section class="card">
    <h2>MATERIALS <button id="addMaterial" class="plus" type="button" title="A new material — a copy of the one being edited" aria-label="Add a material">+</button></h2>
    <div id="base" class="fields"></div>
  </section>

  <details class="card">
    <summary><h2>HAND</h2></summary>
    <button id="rewobble" class="wide" title="The same individual drawn by a different hand — every stroke's shake">NEW HAND</button>
    <div id="proportions" class="props fields"></div>
  </details>

  <section class="card">
    <h2>SPEC</h2>
    <div class="row seg">
      <button id="save">SAVE</button>
      <button id="open">OPEN</button>
    </div>
    <input id="file" type="file" accept="application/json,.json" hidden aria-label="Open a creature file">
  </section>

  <section class="card">
    <h2>NOTES</h2>
    <ul id="notes" class="notes empty"></ul>
  </section>

  <!-- VIEW — how the creature is shown, not what is edited: the pose (the clock's motion, or the bind pose) is the
       screen's, never the spec's, so it stands last, under everything that is -->
  <section class="card">
    <h2>VIEW</h2>
    <div class="sect"><span>POSE</span></div>
    <div class="row seg" id="poseSeg" role="group" aria-label="Pose">
      <button data-pose="motion">MOTION</button>
      <button data-pose="bind" class="on">BIND</button>
    </div>
  </section>

</aside>

<!-- NEW MATERIAL · EDIT MATERIAL — the panel + and a ✎ under a part open (editor.js openDraft): the material's three, each pick the edit -->
<dialog id="newMaterial" class="modal card" aria-labelledby="newMaterialTitle">
  <h2 id="newMaterialTitle">NEW MATERIAL</h2>
  <div id="newMaterialFields" class="fields"></div>
</dialog>

<noscript><p class="noscript">This page needs WebGL and JavaScript.</p></noscript>

<script type="module" src="./src/editor.js"></script>
</body>
</html>
