<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENAGERIE — 디버그</title>
<meta name="description" content="메인 화면 + 포즈·잉크·행위·재생성 조작. 형태와 모션을 판단할 때.">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="stage" aria-label="절차적으로 그려진 크리처 그리드"></canvas>

<header class="bar">
  <a class="mark" href="./index.html">MENAGERIE</a>
  <span class="sub">DEBUG · <a href="./index.html">← GRID</a></span>
  <span class="status" id="status">BOOT</span>
</header>

<aside class="deck">
  <section class="card">
    <h2>SEED</h2>
    <p class="seed" id="seed">·······</p>
    <button id="reseed" class="wide">NEW SEED</button>
  </section>

  <section class="card">
    <h2>POSE</h2>
    <div class="row seg" id="poseSeg" role="group" aria-label="포즈">
      <button data-pose="motion" class="on">MOTION</button>
      <button data-pose="bind">BIND</button>
    </div>
  </section>

  <section class="card">
    <h2>INK</h2>
    <div class="row seg" id="inkSeg" role="group" aria-label="잉크">
      <button data-ink="boil" class="on">BOIL</button>
      <button data-ink="still">STILL</button>
    </div>
  </section>

  <section class="card">
    <h2>ACTION</h2>
    <select id="actionSel" class="wide" aria-label="팔 행위 강제">
      <option value="">AUTO</option>
    </select>
  </section>

  <section class="card">
    <h2>REGEN</h2>
    <div class="row seg" id="liveSeg" role="group" aria-label="재생성 전환">
      <button data-live="off" class="on">STILL</button>
      <button data-live="on">LIVE</button>
    </div>
  </section>

  <section class="card">
    <h2>SPECIES</h2>
    <div class="row seg" id="speciesSeg" role="group" aria-label="종족 프리뷰">
      <button data-species="all" class="on">ALL</button>
      <button data-species="human">HUMAN</button>
      <button data-species="cat">CAT</button>
      <button data-species="pup">PUP</button>
      <button data-species="imp">IMP</button>
    </div>
  </section>

  <section class="card">
    <h2>GRID</h2>
    <div class="row seg" id="countSeg" role="group" aria-label="그리드 크기">
      <button data-grid="1x1">1×1</button>
      <button data-grid="5x4">5×4</button>
      <button data-grid="7x5" class="on">7×5</button>
      <button data-grid="9x6">9×6</button>
    </div>
  </section>

  <section class="card">
    <h2>EXPORT</h2>
    <button id="exportPng" class="wide">PNG</button>
  </section>

  <p class="hint">R 시드 · B 포즈 · I 잉크 · S 재생성 · ACTION은 행위 강제 · 조작이 주소에 실린다 · <a href="./gallery.html">PARTS GALLERY →</a></p>
</aside>

<noscript><p class="noscript">이 페이지는 WebGL과 자바스크립트가 필요합니다.</p></noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
