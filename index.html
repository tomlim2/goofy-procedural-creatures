<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENAGERIE — 안주 절차적 크리처</title>
<meta name="description" content="시드 하나에서 자라나는 손그림 크리처 그리드. 저마다의 시계로 숨쉬고 깜빡이고 두리번거린다.">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="stage" aria-label="절차적으로 그려진 크리처 그리드"></canvas>

<header class="bar">
  <span class="mark">MENAGERIE</span>
  <span class="sub">ANJU / PROCEDURAL CREATURES</span>
  <span class="status" id="status">BOOT</span>
</header>

<aside class="deck">
  <section class="card">
    <h2>SEED</h2>
    <p class="seed" id="seed">·······</p>
    <button id="reseed" class="wide">NEW SEED</button>
  </section>

  <section class="card">
    <h2>GRID</h2>
    <div class="row seg" id="countSeg" role="group" aria-label="그리드 크기">
      <button data-grid="5x4">5×4</button>
      <button data-grid="7x5" class="on">7×5</button>
      <button data-grid="9x6">9×6</button>
    </div>
  </section>

  <p class="hint">R 키로 새 시드 · 주소창 해시가 시드다</p>
</aside>

<noscript><p class="noscript">이 페이지는 WebGL과 자바스크립트가 필요합니다.</p></noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
